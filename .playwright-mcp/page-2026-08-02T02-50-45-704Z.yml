        - generic [ref=f2e1819]:
          - generic [ref=f2e1824]:
            - heading "Análisis económico-financiero" [level=2] [ref=f2e1825]
            - paragraph [ref=f2e1826]: Lectura experta del comportamiento del negocio a partir de los datos actuales
          - generic [ref=f2e1827]:
            - generic [ref=f2e1830]:
              - generic [ref=f2e1831]:
                - heading "Crecimiento estructural (CAGR)" [level=4] [ref=f2e1832]
                - generic [ref=f2e1833]: Favorable
              - paragraph [ref=f2e1834]: Entre 2022 y 2025 los ingresos crecieron a una tasa compuesta anual (CAGR) de 51.5%, pasando de $11.466.160 a $39.897.866. Es una expansión muy acelerada, típica de una etapa de captación agresiva de mercado.
            - generic [ref=f2e1837]:
              - generic [ref=f2e1838]:
                - heading "Crecimiento del último año cerrado (2025)" [level=4] [ref=f2e1839]
                - generic [ref=f2e1840]: Favorable
              - paragraph [ref=f2e1841]:
                - text: Los ingresos crecieron 14.5% frente a 2024 ($34.835.659 → $39.897.866), mientras que los costos lo hicieron en 7.1%. Se observa una
                - strong [ref=f2e1842]: desaceleración
                - text: "respecto al ciclo de crecimiento anterior — la curva de adopción empieza a madurar y el negocio entra en una fase de consolidación más que de expansión explosiva. Lo más relevante: el ingreso creció más rápido que el costo, lo que"
                - strong [ref=f2e1843]: amplía el margen operativo
                - text: — apalancamiento operativo positivo.
            - generic [ref=f2e1846]:
              - generic [ref=f2e1847]:
                - heading "Comparativo año corrido — Ene–Jul 2026 vs. 2025" [level=4] [ref=f2e1848]
                - generic [ref=f2e1849]: Favorable
              - paragraph [ref=f2e1850]:
                - text: En el mismo periodo (Ene–Jul), los ingresos pasaron de $22.235.800 a $22.943.696 (+3.2%), mientras que los costos pasaron de $8.838.212 a $7.786.020 (-11.9%). Se mantiene una
                - strong [ref=f2e1851]: "\"tijera\" favorable de 15.1 puntos"
                - text: ": el ingreso crece más rápido que el costo, lo que sostiene o mejora el margen bruto del periodo. Es la dinámica que conviene proteger — cualquier inversión adicional en adquisición de clientes tiene, hoy, un retorno marginal positivo sobre el margen."
            - generic [ref=f2e1854]:
              - generic [ref=f2e1855]:
                - heading "Estructura de márgenes y unit economics" [level=4] [ref=f2e1856]
                - generic [ref=f2e1857]: Favorable
              - paragraph [ref=f2e1858]:
                - text: El margen bruto histórico es de 65.7% ($86.398.608 sobre $131.549.391 de ingresos, frente a $45.150.783 de costo de pantallas/cuentas). Es un margen alto, propio de un modelo de reventa de licencias digitales con muy bajo costo marginal por usuario adicional. El ticket promedio por transacción es de $53.280, y el 82.4% de las ventas corresponden a
                - strong [ref=f2e1859]: renovaciones
                - text: (vs. 29.1% de activaciones nuevas). Esta proporción confirma que el negocio vive principalmente de su
                - strong [ref=f2e1860]: base instalada
                - text: — la prioridad estratégica debería ser la retención (reducir churn) más que la adquisición pura, porque cada punto de churn cuesta proporcionalmente más que un punto de nueva activación.
            - generic [ref=f2e1863]:
              - generic [ref=f2e1864]:
                - heading "Riesgo de cancelación (churn) y solidez de la base" [level=4] [ref=f2e1865]
                - generic [ref=f2e1866]: Favorable
              - paragraph [ref=f2e1867]: La tasa de cancelación de suscripciones es de 10.5% sobre el universo histórico activo+cancelado, y se registraron 33 bajas en 2026 (año en curso, cifra parcial) (frente a 39 en 2025 ya cerrado). Es un nivel de churn manejable, coherente con un negocio de contenidos digitales de bajo costo de cambio (switching cost). Aun así, cada punto de reducción de churn impacta directamente el margen, porque el costo de retener a un cliente existente es estructuralmente menor que el de activar uno nuevo.
            - generic [ref=f2e1870]:
              - generic [ref=f2e1871]:
                - heading "Lectura ejecutiva y recomendaciones" [level=4] [ref=f2e1872]
                - generic [ref=f2e1873]: Recomendación
              - paragraph [ref=f2e1874]:
                - strong [ref=f2e1875]: Diagnóstico
                - text: ": el negocio consolidó una base rentable (margen 65.7%, markup de 191.4% sobre el costo, CAGR histórico 51.5%), con un punto de equilibrio de apenas 848 ventas frente a un volumen muy superior ya alcanzado, pero mantiene una"
                - strong [ref=f2e1876]: dinámica de crecimiento saludable
                - text: con el ingreso por delante del costo y un momentum de ventas de -0.9% mes a mes.
                - strong [ref=f2e1877]: "Cuatro palancas priorizadas:"
                - text: "1."
                - strong [ref=f2e1878]: Retención sobre adquisición
                - text: — con 82.4% del ingreso viniendo de renovaciones y un churn de 10.5%, reducir la fuga de clientes existentes tiene mayor ROI marginal que captar clientes nuevos. 2.
                - strong [ref=f2e1879]: Eficiencia de costo unitario
                - text: — el costo de pantallas creció 7.1% el último año cerrado; negociar mejores condiciones de recarga/credenciales (TRM, volumen) protege directamente el margen bruto y el markup de 191.4%. 3.
                - strong [ref=f2e1880]: Gestión del riesgo de concentración
                - text: — el 20% de los clientes aporta 49.3% del ingreso (ARPU de $492.694); diversificar la base y fidelizar a los clientes "ancla" con planes anuales reduce la exposición a una caída súbita de ingreso. 4.
                - strong [ref=f2e1881]: Estacionalidad y caja
                - text: — con 322 ventas registradas en lo corrido de 2026 y un momentum reciente de -0.9% mes a mes, conviene proyectar el flujo de caja mensual (ingresos por renovación son recurrentes y predecibles) para anticipar capital de trabajo en los meses de mayor actividad de recargas.
  - generic [ref=f2e1882]: "25"