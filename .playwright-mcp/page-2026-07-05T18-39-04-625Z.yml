        - generic [ref=e1572]:
          - generic [ref=e1573]:
            - img [ref=e1575]
            - generic [ref=e1577]:
              - heading "Análisis económico-financiero" [level=2] [ref=e1578]
              - paragraph [ref=e1579]: Lectura experta del comportamiento del negocio a partir de los datos actuales
          - generic [ref=e1580]:
            - generic [ref=e1583]:
              - generic [ref=e1584]:
                - heading "Crecimiento estructural (CAGR)" [level=4] [ref=e1585]
                - generic [ref=e1586]: Favorable
              - paragraph [ref=e1587]: Entre 2022 y 2025 los ingresos crecieron a una tasa compuesta anual (CAGR) de 51.5%, pasando de $11.466.160 a $39.897.866. Es una expansión muy acelerada, típica de una etapa de captación agresiva de mercado.
            - generic [ref=e1590]:
              - generic [ref=e1591]:
                - heading "Crecimiento del último año cerrado (2025)" [level=4] [ref=e1592]
                - generic [ref=e1593]: Favorable
              - paragraph [ref=e1594]:
                - text: Los ingresos crecieron 14.5% frente a 2024 ($34.835.659 → $39.897.866), mientras que los costos lo hicieron en 7.1%. Se observa una
                - strong [ref=e1595]: desaceleración
                - text: "respecto al ciclo de crecimiento anterior — la curva de adopción empieza a madurar y el negocio entra en una fase de consolidación más que de expansión explosiva. Lo más relevante: el ingreso creció más rápido que el costo, lo que"
                - strong [ref=e1596]: amplía el margen operativo
                - text: — apalancamiento operativo positivo.
            - generic [ref=e1599]:
              - generic [ref=e1600]:
                - heading "Comparativo año corrido — Ene–Jul 2026 vs. 2025" [level=4] [ref=e1601]
                - generic [ref=e1602]: A vigilar
              - paragraph [ref=e1603]:
                - text: En el mismo periodo (Ene–Jul), los ingresos pasaron de $22.235.800 a $21.135.396 (-4.9%), mientras que los costos pasaron de $8.838.212 a $7.786.020 (-11.9%). Se mantiene una
                - strong [ref=e1604]: "\"tijera\" favorable de 7.0 puntos"
                - text: ": el ingreso crece más rápido que el costo, lo que sostiene o mejora el margen bruto del periodo. Es la dinámica que conviene proteger — cualquier inversión adicional en adquisición de clientes tiene, hoy, un retorno marginal positivo sobre el margen."
            - generic [ref=e1607]:
              - generic [ref=e1608]:
                - heading "Estructura de márgenes y unit economics" [level=4] [ref=e1609]
                - generic [ref=e1610]: Favorable
              - paragraph [ref=e1611]:
                - text: El margen bruto histórico es de 65.2% ($84.590.308 sobre $129.741.091 de ingresos, frente a $45.150.783 de costo de pantallas/cuentas). Es un margen alto, propio de un modelo de reventa de licencias digitales con muy bajo costo marginal por usuario adicional. El ticket promedio por transacción es de $52.891, y el 82.5% de las ventas corresponden a
                - strong [ref=e1612]: renovaciones
                - text: (vs. 29.2% de activaciones nuevas). Esta proporción confirma que el negocio vive principalmente de su
                - strong [ref=e1613]: base instalada
                - text: — la prioridad estratégica debería ser la retención (reducir churn) más que la adquisición pura, porque cada punto de churn cuesta proporcionalmente más que un punto de nueva activación.
            - generic [ref=e1616]:
              - generic [ref=e1617]:
                - heading "Riesgo de cancelación (churn) y solidez de la base" [level=4] [ref=e1618]
                - generic [ref=e1619]: A vigilar
              - paragraph [ref=e1620]:
                - text: La tasa de cancelación de suscripciones es de 30.5% sobre el universo histórico activo+cancelado, y se registraron 30 bajas en 2026 (frente a 40 en 2025). Este nivel de churn es
                - strong [ref=e1621]: alto para un negocio de suscripción
                - text: "— cada cliente que se cancela debe ser reemplazado por uno nuevo solo para mantener el ingreso plano, lo que castiga el crecimiento neto y eleva el costo efectivo de adquisición. Recomendación: instrumentar alertas tempranas de vencimiento (el Planificador ya identifica cuentas próximas a vencer) y campañas de retención proactivas antes del corte del servicio."
            - generic [ref=e1624]:
              - generic [ref=e1625]:
                - heading "Lectura ejecutiva y recomendaciones" [level=4] [ref=e1626]
                - generic [ref=e1627]: Recomendación
              - paragraph [ref=e1628]:
                - strong [ref=e1629]: Diagnóstico
                - text: ": el negocio consolidó una base rentable (margen 65.2%, markup de 187.4% sobre el costo, CAGR histórico 51.5%), con un punto de equilibrio de apenas 854 ventas frente a un volumen muy superior ya alcanzado, pero muestra señales de"
                - strong [ref=e1630]: desaceleración en el periodo más reciente
                - text: ", con el costo presionando el margen relativo y un momentum de ventas de -8.6% mes a mes."
                - strong [ref=e1631]: "Cuatro palancas priorizadas:"
                - text: "1."
                - strong [ref=e1632]: Retención sobre adquisición
                - text: — con 82.5% del ingreso viniendo de renovaciones y un churn de 30.5%, reducir la fuga de clientes existentes tiene mayor ROI marginal que captar clientes nuevos. 2.
                - strong [ref=e1633]: Eficiencia de costo unitario
                - text: — el costo de pantallas creció 7.1% el último año cerrado; negociar mejores condiciones de recarga/credenciales (TRM, volumen) protege directamente el margen bruto y el markup de 187.4%. 3.
                - strong [ref=e1634]: Gestión del riesgo de concentración
                - text: — el 20% de los clientes aporta 48.7% del ingreso (ARPU de $491.444); diversificar la base y fidelizar a los clientes "ancla" con planes anuales reduce la exposición a una caída súbita de ingreso. 4.
                - strong [ref=e1635]: Estacionalidad y caja
                - text: — con 306 ventas registradas en lo corrido de 2026 y un momentum reciente de -8.6% mes a mes, conviene proyectar el flujo de caja mensual (ingresos por renovación son recurrentes y predecibles) para anticipar capital de trabajo en los meses de mayor actividad de recargas.
