        - generic [ref=e1685]:
          - generic [ref=e1690]:
            - heading "Análisis económico-financiero" [level=2] [ref=e1691]
            - paragraph [ref=e1692]: Lectura experta del comportamiento del negocio a partir de los datos actuales
          - generic [ref=e1693]:
            - generic [ref=e1696]:
              - generic [ref=e1697]:
                - heading "Crecimiento estructural (CAGR)" [level=4] [ref=e1698]
                - generic [ref=e1699]: Favorable
              - paragraph [ref=e1700]: Entre 2022 y 2025 los ingresos crecieron a una tasa compuesta anual (CAGR) de 51.5%, pasando de $11.466.160 a $39.897.866. Es una expansión muy acelerada, típica de una etapa de captación agresiva de mercado.
            - generic [ref=e1703]:
              - generic [ref=e1704]:
                - heading "Crecimiento del último año cerrado (2025)" [level=4] [ref=e1705]
                - generic [ref=e1706]: Favorable
              - paragraph [ref=e1707]:
                - text: Los ingresos crecieron 14.5% frente a 2024 ($34.835.659 → $39.897.866), mientras que los costos lo hicieron en 7.1%. Se observa una
                - strong [ref=e1708]: desaceleración
                - text: "respecto al ciclo de crecimiento anterior — la curva de adopción empieza a madurar y el negocio entra en una fase de consolidación más que de expansión explosiva. Lo más relevante: el ingreso creció más rápido que el costo, lo que"
                - strong [ref=e1709]: amplía el margen operativo
                - text: — apalancamiento operativo positivo.
            - generic [ref=e1712]:
              - generic [ref=e1713]:
                - heading "Comparativo año corrido — Ene–Jul 2026 vs. 2025" [level=4] [ref=e1714]
                - generic [ref=e1715]: Favorable
              - paragraph [ref=e1716]:
                - text: En el mismo periodo (Ene–Jul), los ingresos pasaron de $22.235.800 a $22.501.696 (+1.2%), mientras que los costos pasaron de $8.838.212 a $7.786.020 (-11.9%). Se mantiene una
                - strong [ref=e1717]: "\"tijera\" favorable de 13.1 puntos"
                - text: ": el ingreso crece más rápido que el costo, lo que sostiene o mejora el margen bruto del periodo. Es la dinámica que conviene proteger — cualquier inversión adicional en adquisición de clientes tiene, hoy, un retorno marginal positivo sobre el margen."
            - generic [ref=e1720]:
              - generic [ref=e1721]:
                - heading "Estructura de márgenes y unit economics" [level=4] [ref=e1722]
                - generic [ref=e1723]: Favorable
              - paragraph [ref=e1724]:
                - text: El margen bruto histórico es de 65.6% ($85.956.608 sobre $131.107.391 de ingresos, frente a $45.150.783 de costo de pantallas/cuentas). Es un margen alto, propio de un modelo de reventa de licencias digitales con muy bajo costo marginal por usuario adicional. El ticket promedio por transacción es de $53.188, y el 82.4% de las ventas corresponden a
                - strong [ref=e1725]: renovaciones
                - text: (vs. 29.2% de activaciones nuevas). Esta proporción confirma que el negocio vive principalmente de su
                - strong [ref=e1726]: base instalada
                - text: — la prioridad estratégica debería ser la retención (reducir churn) más que la adquisición pura, porque cada punto de churn cuesta proporcionalmente más que un punto de nueva activación.
            - generic [ref=e1729]:
              - generic [ref=e1730]:
                - heading "Riesgo de cancelación (churn) y solidez de la base" [level=4] [ref=e1731]
                - generic [ref=e1732]: A vigilar
              - paragraph [ref=e1733]:
                - text: La tasa de cancelación de suscripciones es de 30.5% sobre el universo histórico activo+cancelado, y se registraron 32 bajas en 2026 (frente a 40 en 2025). Este nivel de churn es
                - strong [ref=e1734]: alto para un negocio de suscripción
                - text: "— cada cliente que se cancela debe ser reemplazado por uno nuevo solo para mantener el ingreso plano, lo que castiga el crecimiento neto y eleva el costo efectivo de adquisición. Recomendación: instrumentar alertas tempranas de vencimiento (el Planificador ya identifica cuentas próximas a vencer) y campañas de retención proactivas antes del corte del servicio."
            - generic [ref=e1737]:
              - generic [ref=e1738]:
                - heading "Lectura ejecutiva y recomendaciones" [level=4] [ref=e1739]
                - generic [ref=e1740]: Recomendación
              - paragraph [ref=e1741]:
                - strong [ref=e1742]: Diagnóstico
                - text: ": el negocio consolidó una base rentable (margen 65.6%, markup de 190.4% sobre el costo, CAGR histórico 51.5%), con un punto de equilibrio de apenas 849 ventas frente a un volumen muy superior ya alcanzado, pero mantiene una"
                - strong [ref=e1743]: dinámica de crecimiento saludable
                - text: con el ingreso por delante del costo y un momentum de ventas de -2.8% mes a mes.
                - strong [ref=e1744]: "Cuatro palancas priorizadas:"
                - text: "1."
                - strong [ref=e1745]: Retención sobre adquisición
                - text: — con 82.4% del ingreso viniendo de renovaciones y un churn de 30.5%, reducir la fuga de clientes existentes tiene mayor ROI marginal que captar clientes nuevos. 2.
                - strong [ref=e1746]: Eficiencia de costo unitario
                - text: — el costo de pantallas creció 7.1% el último año cerrado; negociar mejores condiciones de recarga/credenciales (TRM, volumen) protege directamente el margen bruto y el markup de 190.4%. 3.
                - strong [ref=e1747]: Gestión del riesgo de concentración
                - text: — el 20% de los clientes aporta 49.2% del ingreso (ARPU de $491.039); diversificar la base y fidelizar a los clientes "ancla" con planes anuales reduce la exposición a una caída súbita de ingreso. 4.
                - strong [ref=e1748]: Estacionalidad y caja
                - text: — con 318 ventas registradas en lo corrido de 2026 y un momentum reciente de -2.8% mes a mes, conviene proyectar el flujo de caja mensual (ingresos por renovación son recurrentes y predecibles) para anticipar capital de trabajo en los meses de mayor actividad de recargas.
  - generic [ref=e1749]: "25"